<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" href="./reset.min.css" />
		<script type="module" src="./spirit.js?v=20261028"></script>
		<link rel="stylesheet" href="./style.css">
		<title>Spirit Box</title>
	</head>
	<body>
		<form v-scope @vue:mounted="mounted">
			<div id="grille"><p><a href="https://skeptics.nz/" class="link">NZ Skeptics</a> Radio Co<span></span></p></div>
			<div id="tuner">
				<div class="glass"></div>
				<div id="station">
					<div class="scale station-scale">
						<template v-for="id in stationDigits" :key="'digit-' + id">
							<span :class="{active: id === currentStationNumber}">{{id}}</span>
						</template>
					</div>
					<strong>ID</strong>
				</div>
				<div id="bar">{{barPrimary}}</div>
				<div id="bar">{{barSecondary}}</div>
				<div id="tuneTrack">
					<div id="tuneNeedle" :class="needleMotionClass" :style="needleStyle"></div>
				</div>
				<div id="frequency">
					<div class="scale frequency-scale">
						<template v-for="ms in times" :key="ms"><span>{{ms}}</span></template>
					</div>
					<strong>MS</strong>
				</div>
			</div>
			<h2 class="station-title">
				<a v-if="station" :href="station?.website || '#'">{{station?.name || ''}}</a>
				<span v-else>&nbsp;</span>
			</h2>
			<div id="controls">
				<div class="control-hero">
					<div class="transport-group">
						<div class="led" :class="{red: play}" @click="onPlayClick" title="Play / Stop"></div>
						<button id="playButton" type='button' @click.prevent="onPlayClick">{{play ? 'Stop' : 'Play'}}</button>
					</div>
					<div class="control-group volume-knob-group">
						<label for="volumeSlider">Volume</label>
						<div
							class="volume-dial"
							:style="{
								'--dial-fill': ((volume / 100) * 270) + 'deg',
								'--dial-angle': (((volume / 100) * 270) - 135) + 'deg'
							}"
						>
							<div class="volume-dial-value">{{volume}}%</div>
						</div>
						<input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" v-model.number="volume" :title="volume + '%'" @input="updateVolume" @change="updateVolume" />
					</div>
				</div>
				<div class="control-grid">
					<div v-if="allStations?.length" class="control-group">
						<label for="stationCountSlider">Stations <span>{{number}}</span></label>
						<input id="stationCountSlider" type="range" min="4" max="16" v-model.number="number" :title="number + ' stations'" @input="updateStationCount" @change="updateStationCount" />
					</div>
					<div class="control-group">
						<label for="switchSlider">Hop <span>{{ms}}ms</span></label>
						<input id="switchSlider" type="range" min="200" max="1000" step="100" v-model.number="ms" :title="ms + 'ms'" @change="retune" />
					</div>
					<div class="control-group">
						<label for="staticMixSlider">Static <span>{{staticRatio}}%</span></label>
						<input id="staticMixSlider" type="range" min="0" max="100" step="5" v-model.number="staticRatio" :title="staticRatio + '%'" />
					</div>
					<div class="control-group">
						<label for="jitterSlider">Jitter <span>+/-{{jitterMs}}ms</span></label>
						<input id="jitterSlider" type="range" min="0" max="200" step="5" v-model.number="jitterMs" :title="'+/-' + jitterMs + 'ms'" @change="retune" />
					</div>
				</div>
			</div>
			<div id="audioBank">
				<audio v-for="(station, id) in stations" :key="id" :data-audio-index="id" :src="station.url"></audio>
			</div>
	</form>
	</body>
</html>
