<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="icon" type="image/svg+xml" href="./logo.svg">
		<link rel="stylesheet" href="./reset.min.css" />
		<script type="module" src="./spirit.js?v=20261028"></script>
		<link rel="stylesheet" href="./style.css">
		<title>Spirit Box</title>
	</head>
	<body>
		<form v-scope @vue:mounted="mounted">
			<div id="grille"><p><img src="./logo.svg" alt="Spirit Box Logo" class="brand-logo"><a href="https://skeptics.nz/" class="link">NZ Skeptics</a> Radio</p></div>
			<div id="tuner">
				<div class="glass"></div>
				<div id="station">
					<div class="scale station-scale">
						<template v-for="id in stationDigits" :key="'digit-' + id">
							<span :class="{active: id === currentStationNumber}">{{id}}</span>
						</template>
					</div>
					<strong>ID</strong>
				</div>
				<div id="bar">{{barPrimary}}</div>
				<div id="bar">{{barSecondary}}</div>
				<div id="tuneTrack">
					<div id="tuneNeedle" :class="needleMotionClass" :style="needleStyle"></div>
				</div>
				<div id="frequency">
					<div class="scale frequency-scale">
						<template v-for="ms in times" :key="ms"><span>{{ms}}</span></template>
					</div>
					<strong>MS</strong>
				</div>
			</div>
			<h2 class="station-title">
				<a v-if="station" :href="station?.website || '#'">{{station?.name || ''}}</a>
				<span v-else>&nbsp;</span>
			</h2>
			<div id="controls">
				<div class="control-hero">
					<div class="transport-group">
						<div class="led" :class="{red: play}" @click="onPlayClick" title="Play / Stop"></div>
						<button id="playButton" type='button' @click.prevent="onPlayClick">{{play ? 'Stop' : 'Play'}}</button>
					</div>
					<div v-if="controls.volume.visible !== false" class="control-group volume-knob-group">
						<label for="volumeSlider">Volume</label>
						<div
							class="volume-dial"
							:style="{
								'--dial-fill': ((controls.volume.value / 100) * 270) + 'deg',
								'--dial-angle': (((controls.volume.value / 100) * 270) - 135) + 'deg'
							}"
						>
							<div class="volume-dial-value">{{controls.volume.value}}%</div>
						</div>
						<input id="volumeSlider" class="volume-slider" type="range" :min="controls.volume.min" :max="controls.volume.max" :step="controls.volume.step" v-model.number="controls.volume.value" :title="controls.volume.value + '%'" @input="updateVolume" @change="updateVolume" />
					</div>
				</div>
				<div class="control-grid">
					<div v-if="controls.stations.visible !== false" class="control-group">
						<label for="stationCountSlider">Stations <span>{{controls.stations.value}}</span></label>
						<input id="stationCountSlider" type="range" :min="controls.stations.min" :max="controls.stations.max" v-model.number="controls.stations.value" :title="controls.stations.value + ' stations'" :disabled="!allStations?.length" @input="updateStationCount" @change="updateStationCount" />
					</div>
					<div v-if="controls.hopIntervalMs.visible !== false" class="control-group">
						<label for="switchSlider">Hop <span>{{controls.hopIntervalMs.value}}ms</span></label>
						<input id="switchSlider" type="range" :min="controls.hopIntervalMs.min" :max="controls.hopIntervalMs.max" :step="controls.hopIntervalMs.step" v-model.number="controls.hopIntervalMs.value" :title="controls.hopIntervalMs.value + 'ms'" @change="retune" />
					</div>
					<div v-if="controls.stationDensity.visible !== false" class="control-group">
						<label for="stationDensitySlider">Station Density <span>{{controls.stationDensity.value}}%</span></label>
						<input id="stationDensitySlider" type="range" :min="controls.stationDensity.min" :max="controls.stationDensity.max" :step="controls.stationDensity.step" v-model.number="controls.stationDensity.value" :title="controls.stationDensity.value + '%'" />
					</div>
					<div v-if="controls.jitterMs.visible !== false" class="control-group">
						<label for="jitterSlider">Jitter <span>+/-{{controls.jitterMs.value}}ms</span></label>
						<input id="jitterSlider" type="range" :min="controls.jitterMs.min" :max="controls.jitterMs.max" :step="controls.jitterMs.step" v-model.number="controls.jitterMs.value" :title="'+/-' + controls.jitterMs.value + 'ms'" @change="retune" />
					</div>
					<div v-if="controls.sliderMotion.visible !== false" class="control-group">
						<label for="sliderMotionSwitch">Slider Motion <span>{{sliderMotionLabel}}</span></label>
						<div id="sliderMotionSwitch" class="tri-switch dual-switch" role="group" aria-label="Slider motion mode">
							<button type="button" title="Jump randomly" :class="{active: controls.sliderMotion.value === 0}" @click="controls.sliderMotion.value = 0; updateSliderMotion()">Random</button>
							<button type="button" title="Sweep left to right" :class="{active: controls.sliderMotion.value === 1}" @click="controls.sliderMotion.value = 1; updateSliderMotion()">Sweep</button>
						</div>
					</div>
					<div v-if="controls.chunkMode.visible !== false" class="control-group">
						<label for="chunkModeSlider">Chunking <span>{{chunkModeLabel}}</span></label>
						<input id="chunkModeSlider" type="range" :min="controls.chunkMode.min" :max="controls.chunkMode.max" :step="controls.chunkMode.step" v-model.number="controls.chunkMode.value" :title="'Chunking ' + chunkModeLabel" @input="updateChunkMode" @change="updateChunkMode" />
						<div class="tri-hints"><span>Off</span><span>750</span><span>1500</span></div>
					</div>
					<div v-if="controls.staticPreset.visible !== false" class="control-group">
						<label for="presetSwitch">Static <span>{{staticPresetLabel}}</span></label>
						<div id="presetSwitch" class="tri-switch" role="group" aria-label="Static preset">
							<button type="button" title="Soft (Conservative)" :class="{active: controls.staticPreset.value === 0}" @click="controls.staticPreset.value = 0; updateStaticPreset()">Soft</button>
							<button type="button" title="Medium (Classic)" :class="{active: controls.staticPreset.value === 1}" @click="controls.staticPreset.value = 1; updateStaticPreset()">Medium</button>
							<button type="button" title="Hard (Aggressive)" :class="{active: controls.staticPreset.value === 2}" @click="controls.staticPreset.value = 2; updateStaticPreset()">Hard</button>
						</div>
					</div>
				</div>
			</div>
			<div id="audioBank">
				<audio v-for="(station, id) in stations" :key="id" :data-audio-index="id" :src="station.url"></audio>
			</div>
	</form>
	</body>
</html>
